[project]
name = "setback-sim"
version = "0.1.0"
description = "Monte Carlo simulator and bidding tables for Setback (Pitch), with CPU and GPU engines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4,<2.5",   # numba-cuda 0.30 still calls np.row_stack, removed in NumPy 2.5
    "numba>=0.68",
    "pandas>=3.0",
]

[project.optional-dependencies]
gpu = ["numba-cuda[cu13]>=0.30"]          # CUDA 13: Turing (RTX 20xx) and newer, driver 580+
gpu-cu12 = ["numba-cuda[cu12]>=0.30"]     # CUDA 12: older cards such as Pascal (GTX 10xx), driver 525+
dist = ["fastapi>=0.110", "uvicorn>=0.30"]

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "gpu-cu12" }]]
