# Stats site: build the Parquet data and page (site/build.py) and publish to GitHub Pages.
# The every-hand table comes prebuilt from the latest release (allhands.parquet), so the
# build only needs pandas and pyarrow and takes seconds. After publishing a release, run
# this workflow by hand on main (gh workflow run pages.yml --ref main): the github-pages
# environment only deploys from main, so a release-triggered run (on the tag) is rejected.
name: Stats site

on:
  push:
    branches: [main]
    paths: ["site/**", "charts/**", "condensed_*.csv", "cardsim/pitch/rules.py", "cardsim/pitch/notes.py", "cardsim/pitch/lines.py",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Every-hand table from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'allhands.parquet' --dir tables || echo "no every-hand table; building without it"
      - name: Build
        run: uv run --no-project --python 3.14 --with pandas --with pyarrow python site/build.py --tables tables
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
