# Stats site: build the Parquet data and page (site/build.py) and publish to GitHub Pages.
# The every-hand table comes prebuilt from the latest release (allhands.parquet), so the
# build only needs pandas and pyarrow and takes seconds.
name: Stats site

on:
  push:
    branches: [main]
    paths: ["site/**", "charts/**", "condensed_*.csv", "cardsim/pitch/rules.py", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Every-hand table from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'allhands.parquet' --dir tables || echo "no every-hand table; building without it"
      - name: Build
        run: uv run --no-project --python 3.14 --with pandas --with pyarrow python site/build.py --tables tables
      - name: Probe (temporary) which extensions Pages leaves uncompressed
        run: for e in zip gz png wasm bin arrow br; do cp site/_build/data/charts.parquet site/_build/data/probe.$e; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
