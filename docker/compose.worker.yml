# GPU worker (run on each machine with an NVIDIA GPU and the NVIDIA Container Toolkit):
#   COORDINATOR_URL=http://<coordinator-ip>:8700 docker compose -f docker/compose.worker.yml up -d --build
# For older cards (GTX 10xx, driver < 580) also set GPU_EXTRA=gpu-cu12.
services:
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: {GPU_EXTRA: "${GPU_EXTRA:-gpu}"}
    image: setback-sim:${GPU_EXTRA:-gpu}
    command: ["python", "-m", "cardsim.dist.worker"]
    environment:
      COORDINATOR_URL: ${COORDINATOR_URL:?set COORDINATOR_URL, e.g. http://192.168.1.10:8700}
      COORDINATOR_TOKEN: ${COORDINATOR_TOKEN:-}
      TARGET_MINUTES: ${TARGET_MINUTES:-7.5}
      WORKER_AUTO_UPDATE: ${WORKER_AUTO_UPDATE:-0}  # 1: fetch a study's code from GitHub (update.py)
      WORKER_DEVICE: ${WORKER_DEVICE:-auto}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    volumes: ["worker-code:/root/.cache/setback-sim"]  # code fetched by auto-update
    restart: unless-stopped

volumes:
  worker-code:
